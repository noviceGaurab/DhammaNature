<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin - Vendors</title>
    <th:block th:replace="~{fragments/admin-nav :: adminAssets}"></th:block>
</head>
<body class="admin-body">

<div class="admin-shell">
    <aside th:replace="~{fragments/admin-nav :: adminSidebar('vendors')}"></aside>

    <div class="admin-main">
        <header th:replace="~{fragments/admin-nav :: adminTopbar('Marketplace Vendors', 'Verify vendors before their products are publicly available.')}"></header>

        <main class="admin-content">
            <div class="admin-page-header">
                <div class="admin-page-title">
                    <h2>Vendors</h2>
                    <p>Review marketplace vendors and approve verified sellers.</p>
                </div>
            </div>

            <section class="admin-card">
                <div class="admin-card-header">
                    <h3>
                        <i class="fa-solid fa-store"></i>
                        Vendor Records
                    </h3>
                    <span class="admin-badge info" th:text="${#lists.size(vendors)} + ' vendors'">0 vendors</span>
                </div>

                <div class="admin-card-body">
                    <div class="admin-empty" th:if="${#lists.isEmpty(vendors)}">
                        <i class="fa-solid fa-store-slash"></i>
                        <p>No vendors available.</p>
                    </div>

                    <div class="admin-table-wrap" th:unless="${#lists.isEmpty(vendors)}">
                        <table class="admin-table">
                            <thead>
                            <tr>
                                <th>ID</th>
                                <th>Vendor</th>
                                <th>Contact</th>
                                <th>Address</th>
                                <th>Products</th>
                                <th>Status</th>
                                <th>Action</th>
                            </tr>
                            </thead>

                            <tbody>
                            <tr th:each="v : ${vendors}">
                                <td th:text="${v.id}">1</td>
                                <td>
                                    <strong th:text="${v.vendorName}">Vendor Name</strong>
                                </td>
                                <td th:text="${v.contactDetails}">Contact</td>
                                <td th:text="${v.address}">Address</td>
                                <td>
                                    <span class="admin-badge info" th:text="${#lists.size(v.products)} + ' products'">0 products</span>
                                </td>
                                <td>
                                    <span class="admin-badge success" th:if="${v.verified}">
                                        <i class="fa-solid fa-circle-check"></i>
                                        Verified
                                    </span>
                                    <span class="admin-badge warning" th:unless="${v.verified}">
                                        <i class="fa-solid fa-clock"></i>
                                        Pending
                                    </span>
                                </td>
                                <td>
                                    <form th:unless="${v.verified}" method="post" th:action="@{'/admin/vendors/' + ${v.id} + '/verify'}">
                                        <button type="submit" class="admin-btn success">
                                            <i class="fa-solid fa-check"></i>
                                            Approve
                                        </button>
                                    </form>

                                    <span class="admin-badge success" th:if="${v.verified}">
                                        Approved
                                    </span>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </section>
        </main>
    </div>
</div>

<div th:replace="~{fragments/admin-nav :: bootstrapJs}"></div>
</body>
</html>
