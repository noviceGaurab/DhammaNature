<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin - Meditation Centers</title>
    <th:block th:replace="~{fragments/admin-nav :: adminAssets}"></th:block>
</head>
<body class="admin-body">

<div class="admin-shell">
    <aside th:replace="~{fragments/admin-nav :: adminSidebar('centers')}"></aside>

    <div class="admin-main">
        <header th:replace="~{fragments/admin-nav :: adminTopbar('Meditation Centers', 'Review and approve meditation center profiles.')}"></header>

        <main class="admin-content">
            <div class="admin-page-header">
                <div class="admin-page-title">
                    <h2>Meditation Centers</h2>
                    <p>Approve organizations before their profiles, events, and campaigns become visible.</p>
                </div>
            </div>

            <section class="admin-card">
                <div class="admin-card-header">
                    <h3>
                        <i class="fa-solid fa-place-of-worship"></i>
                        Center Records
                    </h3>
                    <span class="admin-badge info" th:text="${#lists.size(centers)} + ' centers'">0 centers</span>
                </div>

                <div class="admin-card-body">
                    <div class="admin-empty" th:if="${#lists.isEmpty(centers)}">
                        <i class="fa-solid fa-place-of-worship"></i>
                        <p>No meditation centers available.</p>
                    </div>

                    <div class="admin-table-wrap" th:unless="${#lists.isEmpty(centers)}">
                        <table class="admin-table">
                            <thead>
                            <tr>
                                <th>ID</th>
                                <th>Center Name</th>
                                <th>Location</th>
                                <th>Contact Email</th>
                                <th>Status</th>
                                <th>Action</th>
                            </tr>
                            </thead>

                            <tbody>
                            <tr th:each="c : ${centers}">
                                <td th:text="${c.id}">1</td>
                                <td>
                                    <strong th:text="${c.name}">Center Name</strong>
                                </td>
                                <td th:text="${c.location}">Location</td>
                                <td th:text="${c.contactEmail}">email@example.com</td>
                                <td>
                                    <span class="admin-badge success" th:if="${c.verified}">
                                        <i class="fa-solid fa-circle-check"></i>
                                        Verified
                                    </span>
                                    <span class="admin-badge warning" th:unless="${c.verified}">
                                        <i class="fa-solid fa-clock"></i>
                                        Pending
                                    </span>
                                </td>
                                <td>
                                    <form th:unless="${c.verified}" method="post" th:action="@{'/admin/centers/' + ${c.id} + '/verify'}">
                                        <button type="submit" class="admin-btn success">
                                            <i class="fa-solid fa-check"></i>
                                            Approve
                                        </button>
                                    </form>

                                    <span class="admin-badge success" th:if="${c.verified}">
                                        Approved
                                    </span>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </section>
        </main>
    </div>
</div>

<div th:replace="~{fragments/admin-nav :: bootstrapJs}"></div>
</body>
</html>
