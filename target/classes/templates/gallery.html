<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Dhamma Nature - Gallery</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; padding: 60px 8%; }
        .tile { border-radius: 10px; overflow: hidden; box-shadow: 0 4px 14px rgba(0,0,0,.08); }
        .tile img { width: 100%; height: 200px; object-fit: cover; display:block; }
        .tile .cap { padding: 10px; font-size: 14px; color:#333; }
    </style>
</head>
<body>
<div th:replace="~{fragments/header :: siteHeader('GALLERY', null)}"></div>
<main>
    <p style="padding: 30px 8% 0;" th:if="${#lists.isEmpty(images)}">No photos published yet.</p>
    <div class="grid">
        <div class="tile" th:each="img : ${images}">
            <img th:src="@{'/assets/images/' + ${img.imageUrl}}" th:alt="${img.title}" onerror="this.src='/assets/images/transparent_logo.png'"/>
            <div class="cap" th:text="${img.title}">Title</div>
        </div>
    </div>
</main>
<div th:replace="~{fragments/footer :: siteFooter}"></div>
</body>
</html>
