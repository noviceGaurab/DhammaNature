<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dhamma Nature - Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="/css/login.css">
</head>
<body>
    <div class="sanctuary">
        <div class="meditation-image">
            <img src="/assets/images/pexels-eky-rima-nurya-ganda-174710171-15147310.jpg" alt="Meditation Image" />
        </div>
        <div class="dharma-form">
            <div class="logo-display">
                <img src="/assets/images/logo.png" alt="Dhamma Nature Logo" />
            </div>
            <div class="welcome-message"><i class="fas fa-door-open"></i> Welcome back! Please enter your details.</div>
            <p style="color:green" th:if="${signupsuccessful}" th:text="${signupsuccessful}"></p>
            <p style="color:red" th:if="${error}" th:text="${error}"></p>
            <form method="post" action="/login">
                <div class="input-group">
                    <label for="email">Email</label>
                    <div class="input-wrapper">
                        <i class="fas fa-envelope input-icon"></i>
                        <input type="email" id="email" name="email" placeholder="Email" required>
                    </div>
                </div>
                <div class="input-group">
                    <label for="password">Password</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock input-icon"></i>
                        <input type="password" id="password" name="password" placeholder="Password" required>
                    </div>
                </div>
                <button type="submit" class="login-btn"><i class="fas fa-sign-in-alt"></i> Log in</button>
            </form>
            <div class="signup-section">
                <span>Don't have an account?</span> <a href="/signup"><i class="fas fa-user-plus"></i> Sign up</a>
            </div>
        </div>
    </div>
    <script src="/JS/login.js"></script>
</body>
</html>
