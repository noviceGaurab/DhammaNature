<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Donation Receipt</title>
    <link rel="stylesheet" href="/css/donation_confirm.css">
    <style>
        .receipt { max-width: 480px; margin: 60px auto; border: 1px solid #eee; border-radius: 10px; overflow: hidden; }
        .receipt-header { background:#233c9b; color:#fff; padding: 20px; text-align:center; }
        table { width:100%; border-collapse: collapse; }
        td { padding: 10px 20px; border-bottom: 1px solid #f0f0f0; }
        td:first-child { color:#666; }
    </style>
</head>
<body>
<div th:replace="~{fragments/header :: siteHeader(null, null)}"></div>
<div class="receipt" th:if="${donation}">
    <div class="receipt-header"><h2>Thank you for your donation!</h2></div>
    <table>
        <tr><td>Donor</td><td th:text="${donation.firstName} + ' ' + (${donation.lastName} ?: '')"></td></tr>
        <tr><td>Date</td><td th:text="${#temporals.format(donation.donationDate, 'dd MMM yyyy, HH:mm')}"></td></tr>
        <tr><td>Amount</td><td th:text="${donation.amount}"></td></tr>
        <tr><td>Campaign</td><td th:text="${donation.campaign != null ? donation.campaign.title : 'General donation'}"></td></tr>
        <tr><td>Receipt ID</td><td th:text="${donation.receiptNumber}"></td></tr>
        <tr><td>Payment method</td><td th:text="${donation.paymentMethod}"></td></tr>
    </table>
</div>
<p th:unless="${donation}" style="text-align:center; margin: 60px 0;">
    Receipt details are only shown right after donating. <a href="/donate">Make a donation</a>
</p>
<div th:replace="~{fragments/footer :: siteFooter}"></div>
</body>
</html>
