<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Dhamma Nature - Rewards</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="/css/rewards.css">
</head>
<body>
<div th:replace="~{fragments/header :: siteHeader('REWARDS', 'NFR-04: earn points, redeem incense coupons, discounts & more')}"></div>
<main class="wrap">

    <div class="page-heading">
        <h1>Rewards</h1>
        <p>Earn points as you go and redeem them for incense coupons, discounts, and more.</p>
    </div>

    <p class="msg-ok" th:if="${success}" th:text="${success}"></p>
    <p class="msg-err" th:if="${error}" th:text="${error}"></p>

    <div class="balance-banner" th:if="${currentUser != null}">
        <div>
            <div class="label">Your balance</div>
            <span class="points-badge" th:text="${currentUser.rewardPoints} + ' points'">0 points</span>
        </div>
    </div>

    <p class="login-banner" th:if="${currentUser == null}">
        <a href="/login">Log in</a> to see your reward point balance and redeem items.
    </p>

    <h2 class="section-heading">Reward Catalog</h2>
    <hr class="section-underline">
    <p class="empty-note" th:if="${#lists.isEmpty(catalog)}">No rewards available right now.</p>
    <div class="grid">
        <div class="item" th:each="item : ${catalog}">
            <h4 th:text="${item.name}">Item</h4>
            <p class="item-desc" th:text="${item.description}">Description</p>
            <div class="item-meta">
                <span class="cost-tag" th:text="${item.pointsCost} + ' pts'"></span>
                <span class="category-tag" th:text="${item.category}"></span>
            </div>
            <form th:if="${currentUser != null}" method="post" th:action="@{'/rewards/' + ${item.id} + '/redeem'}">
                <button type="submit" class="btn-redeem">Redeem</button>
            </form>
        </div>
    </div>

    <div th:if="${history != null}">
        <h2 class="section-heading">Your reward history</h2>
        <hr class="section-underline">
        <div class="history-wrap">
            <table>
                <tr><th>Date</th><th>Type</th><th>Points</th><th>Reason</th></tr>
                <tr th:each="tx : ${history}">
                    <td th:text="${#temporals.format(tx.createdAt, 'dd MMM yyyy')}"></td>
                    <td th:text="${tx.type}"></td>
                    <td th:text="${tx.points}"></td>
                    <td th:text="${tx.reason}"></td>
                </tr>
            </table>
        </div>
    </div>

</main>
<div th:replace="~{fragments/footer :: siteFooter}"></div>
</body>
</html>
