<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="stylesheet" href="/css/site-header.css">
    <link rel="stylesheet" href="/css/nav-dropdown.css">
    <script defer src="/JS/nav-dropdown.js"></script>
</head>
<body>
<header th:fragment="siteHeader(pageTitle, pageSubtitle)">
    <div class="header-img" id="hero">
        <img src="/assets/images/pexels-2152214764-32117889.jpg" alt="Header Image">
        <div class="hero">
            <h2>WELCOME TO DHAMMA NATURE</h2>
            <h1 th:text="${pageTitle}">PAGE TITLE</h1>
            <p th:if="${pageSubtitle != null}" th:text="${pageSubtitle}">Page subtitle</p>
        </div>
        
        
        <div class="header-main">
            <a href="/"><img src="/assets/images/transparent_logo.png" alt="Dhamma Nature Logo" class="logo"></a>
            <nav>
                <a href="/" class="nav-link">Home</a>
                <a href="/about" class="nav-link">About</a>
                <div class="dropdown">
                    <a href="/upcoming-sermons" class="nav-link">Sermons</a>
                    <div class="dropdown-content"><a href="/upcoming-sermons">Upcoming Sermons</a><a href="/teachings">Teachings</a></div>
                </div>
                <div class="dropdown">
                    <a href="/events" class="nav-link">Events</a>
                    <div class="dropdown-content"><a href="/events">Upcoming Events</a><a href="/centers">Meditation Centers</a></div>
                </div>
                <div class="dropdown">
                    <a href="/marketplace" class="nav-link">Explore</a>
                    <div class="dropdown-content"><a href="/marketplace">Marketplace</a><a href="/gallery">Gallery</a><a href="/quiz">Quizzes</a><a href="/rewards">Rewards</a><a href="/volunteer">Volunteer</a><a href="/charity">Charity</a><a href="/community">Community</a><a href="/discuss">Discuss</a></div>
                </div>
                <a href="/blog" class="nav-link">Blog</a>
                
                
            </nav><div class="header-right"><a href="/profile" class="profile-nav-link" title="My Profile"><i class="fas fa-user-circle"></i></a></div>
            <a href="#" class="hamburger"><i class="fas fa-bars"></i></a>
        </div>
    </div>
</header>
</body>
</html>
