<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Dhamma Nature - Volunteer</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        .wrap { max-width: 800px; margin: 0 auto; padding: 60px 20px; }
        .msg-ok { color:#155724; background:#d4edda; padding:10px 14px; border-radius:6px; }
        .msg-err { color:#721c24; background:#f8d7da; padding:10px 14px; border-radius:6px; }
        .row { border: 1px solid #eee; border-radius: 10px; padding: 16px; margin-bottom: 14px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;}
    </style>
</head>
<body>
<div th:replace="~{fragments/header :: siteHeader('VOLUNTEER', 'NFR-06: food distribution, cleaning, tree plantation, religious events')}"></div>
<main class="wrap">
    <p class="msg-ok" th:if="${success}" th:text="${success}"></p>
    <p class="msg-err" th:if="${error}" th:text="${error}"></p>

    <p th:if="${#lists.isEmpty(opportunities)}">No volunteer opportunities posted yet.</p>
    <div class="row" th:each="o : ${opportunities}">
        <div>
            <strong th:text="${o.title}">Title</strong><br>
            <span th:text="${o.opportunityDate}"></span> &middot; <span th:text="${o.location}"></span><br>
            <small th:text="${o.description}"></small><br>
            <small>Hosted by <span th:text="${o.meditationCenter.name}"></span></small>
        </div>
        <form method="post" th:action="@{'/volunteer/' + ${o.id} + '/register'}">
            <button type="submit" class="btn btn-primary">Sign up</button>
        </form>
    </div>
</main>
<div th:replace="~{fragments/footer :: siteFooter}"></div>
</body>
</html>
