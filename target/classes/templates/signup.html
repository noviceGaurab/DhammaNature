<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Dhamma Nature</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="/css/login.css">
</head>
<body class="auth-page">
    <div class="auth-wrap">
        <div class="auth-card">
            <aside class="auth-cover">
                <img src="/assets/images/pexels-eky-rima-nurya-ganda-174710171-15147310.jpg" alt="Meditation" />
                <div class="cover-quote">
                    <p>"Every morning we are born again. What we do today is what matters most."</p>
                    <span>Join the community</span>
                </div>
            </aside>
            <section class="auth-panel">
                <a class="auth-back" href="/"><i class="fas fa-home"></i> Home</a>
                <div class="auth-logo">
                    <img src="/assets/images/logo.png" alt="Dhamma Nature Logo" />
                </div>
                <h1 class="auth-title">Join Dhamma Nature</h1>
                <p class="auth-subtitle">Create your account to explore teachings, events &amp; the community.</p>

                <p class="msg msg-error" th:if="${signupfail}" th:text="${signupfail}"></p>

                <form class="auth-form" method="post" action="/signup">
                    <div class="input-group">
                        <label for="email">Email</label>
                        <div class="input-wrapper">
                            <i class="fas fa-envelope input-icon"></i>
                            <input type="email" id="email" name="Email" placeholder="Enter your email" required autocomplete="email">
                        </div>
                    </div>
                    <div class="input-group">
                        <label for="password">Password</label>
                        <div class="input-wrapper">
                            <i class="fas fa-lock input-icon"></i>
                            <input type="password" id="password" name="Password" placeholder="Create a password (min. 8 characters)" minlength="8" required autocomplete="new-password">
                            <button type="button" class="password-toggle" data-toggle-for="password" aria-label="Show password"><i class="fas fa-eye"></i></button>
                        </div>
                    </div>
                    <div class="input-group">
                        <label for="gender">Gender identification (optional)</label>
                        <div class="input-wrapper">
                            <i class="fas fa-heart input-icon"></i>
                            <input type="text" id="gender" name="Gender_Identity" placeholder="Let us know if you'd like to clarify your gender or orientation, and your pronoun">
                        </div>
                    </div>
                    <div class="checkbox-row">
                        <input type="checkbox" id="acceptTerms" name="acceptTerms" required>
                        <label for="acceptTerms">I have read the community guidelines and accept the Terms of Service.</label>
                    </div>
                    <button type="submit" class="login-btn"><i class="fas fa-user-plus"></i> Sign Up</button>
                </form>

                <div class="auth-switch">
                    Already have an account? <a href="/login"><i class="fas fa-sign-in-alt"></i> Log in</a>
                </div>
            </section>
        </div>
    </div>
    <script>
        document.querySelectorAll('.password-toggle').forEach(function (btn) {
            btn.addEventListener('click', function () {
                var input = document.getElementById(btn.dataset.toggleFor);
                var show = input.type === 'password';
                input.type = show ? 'text' : 'password';
                btn.querySelector('i').className = show ? 'fas fa-eye-slash' : 'fas fa-eye';
            });
        });
    </script>
</body>
</html>
