<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Dhamma Nature - Marketplace</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; padding: 60px 8%; }
        .card { border: 1px solid #eee; border-radius: 10px; padding: 16px; box-shadow: 0 4px 14px rgba(0,0,0,.06); }
        .card img { width:100%; height:150px; object-fit:cover; border-radius:6px; }
        .price { font-weight: 700; color:#233c9b; }
    </style>
</head>
<body>
<div th:replace="~{fragments/header :: siteHeader('MARKETPLACE', 'FR-07: authentic Dhamma products from verified vendors')}"></div>
<main>
    <p style="padding: 30px 8% 0;" th:if="${#lists.isEmpty(products)}">No products listed yet.</p>
    <div class="grid">
        <div class="card" th:each="p : ${products}">
            <img th:if="${p.imageUrl}" th:src="@{'/assets/images/' + ${p.imageUrl}}" alt="product"/>
            <img th:unless="${p.imageUrl}" src="/assets/images/pexels-tkirkgoz-15277853.jpg" alt="product"/>
            <h4 th:text="${p.productName}">Product</h4>
            <p class="price" th:text="${p.price}">$0</p>
            <p><small th:text="${p.vendor.vendorName}"></small></p>
            <a th:href="@{'/marketplace/' + ${p.id}}" class="btn btn-primary">View</a>
        </div>
    </div>
</main>
<div th:replace="~{fragments/footer :: siteFooter}"></div>
</body>
</html>
