<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Dhamma Nature - Quizzes</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 20px; padding: 60px 8%; }
        .card { border: 1px solid #eee; border-radius: 10px; padding: 18px; box-shadow: 0 4px 14px rgba(0,0,0,.06); }
    </style>
</head>
<body>
<div th:replace="~{fragments/header :: siteHeader('DHAMMA QUIZZES', 'FR-08: learn while you earn reward points')}"></div>
<main>
    <p style="padding: 30px 8% 0;" th:if="${#lists.isEmpty(quizzes)}">No quizzes published yet.</p>
    <div class="grid">
        <div class="card" th:each="q : ${quizzes}">
            <h3 th:text="${q.title}">Quiz</h3>
            <p th:text="${q.description}">Description</p>
            <p><small th:text="${#lists.size(q.questions)} + ' questions · up to ' + ${q.rewardPoints} + ' points'"></small></p>
            <a th:href="@{'/quiz/' + ${q.id}}" class="btn btn-primary">Start quiz</a>
        </div>
    </div>
</main>
<div th:replace="~{fragments/footer :: siteFooter}"></div>
</body>
</html>
