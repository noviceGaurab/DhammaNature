<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin - Donations</title>
    <th:block th:replace="~{fragments/admin-nav :: adminAssets}"></th:block>
<link rel="stylesheet" href="/css/responsive.css"/>
    </head>
<body class="admin-body">

<div class="admin-shell">
    <aside th:replace="~{fragments/admin-nav :: adminSidebar('donations')}"></aside>

    <div class="admin-main">
        <header th:replace="~{fragments/admin-nav :: adminTopbar('Donation Records', 'Monitor donation history, campaigns, receipts, and payment methods.')}"></header>

        <main class="admin-content">
            <div class="admin-page-header">
                <div class="admin-page-title">
                    <h2>Donations</h2>
                    <p>View donation records submitted through the platform.</p>
                </div>
            </div>

            <section class="admin-card">
                <div class="admin-card-header">
                    <h3>
                        <i class="fa-solid fa-hand-holding-heart"></i>
                        Donation Records
                    </h3>
                    <span class="admin-badge info" th:text="${#lists.size(donationData)} + ' donations'">0 donations</span>
                </div>

                <div class="admin-card-body">
                    <div class="admin-empty" th:if="${#lists.isEmpty(donationData)}">
                        <i class="fa-solid fa-circle-dollar-to-slot"></i>
                        <p>No donation data available.</p>
                    </div>

                    <div class="admin-table-wrap" th:unless="${#lists.isEmpty(donationData)}">
                        <table class="admin-table">
                            <thead>
                            <tr>
                                <th>Donation ID</th>
                                <th>Donor</th>
                                <th>Campaign</th>
                                <th>Amount</th>
                                <th>Type</th>
                                <th>Payment Method</th>
                                <th>Receipt #</th>
                                <th>Date</th>
                            </tr>
                            </thead>

                            <tbody>
                            <tr th:each="d : ${donationData}">
                                <td th:text="${d.id}">1</td>
                                <td>
                                    <strong th:text="${d.firstName + ' ' + (d.lastName ?: '')}">Donor Name</strong>
                                </td>
                                <td th:text="${d.campaign != null ? d.campaign.title : '-'}">Campaign</td>
                                <td>
                                    <span class="admin-badge success" th:text="${d.amount}">0</span>
                                </td>
                                <td>
                                    <span class="admin-badge" th:text="${d.donationType}">Type</span>
                                </td>
                                <td th:text="${d.paymentMethod}">Payment</td>
                                <td th:text="${d.receiptNumber}">Receipt</td>
                                <td th:text="${#temporals.format(d.donationDate, 'dd MMM yyyy HH:mm')}">01 Jan 2024 10:00</td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </section>
        </main>
    </div>
</div>

<div th:replace="~{fragments/admin-nav :: bootstrapJs}"></div>
</body>
</html>
