<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin - Comments</title>
    <link th:replace="~{fragments/admin-nav :: bootstrapCss}" />
    <style>
        body { padding: 0 24px 40px; font-family: 'Roboto', sans-serif; }
        table { border-collapse: collapse; width: 100%; }
        td, th { border: 1px solid #ddd; padding: 8px 10px; text-align: left; font-size: 14px; }
        th { background: #f4f4f4; }
    </style>
</head>
<body>
<nav th:replace="~{fragments/admin-nav :: adminNav}"></nav>
<h1>Discussion Comments</h1>
<hr>
<p th:if="${#lists.isEmpty(interactionData)}">No comments yet.</p>
<table th:unless="${#lists.isEmpty(interactionData)}">
<tr>
    <th>ID</th><th>Topic</th><th>Content</th><th>Name</th><th>Email</th><th>User ID</th><th>Created At</th><th>Hidden</th><th></th>
</tr>
<tr th:each="c : ${interactionData}">
    <td th:text="${c.id}"></td>
    <td th:text="${c.topic.title}"></td>
    <td th:text="${c.content}"></td>
    <td th:text="${c.name}"></td>
    <td th:text="${c.email}"></td>
    <td th:text="${c.user != null ? c.user.id : '-'}"></td>
    <td th:text="${#temporals.format(c.createdAt, 'dd MMM yyyy HH:mm')}"></td>
    <td th:text="${c.hidden}"></td>
    <td>
        <form th:if="${!c.hidden}" method="post" th:action="@{'/admin/comments/' + ${c.id} + '/hide'}">
            <button type="submit">Hide</button>
        </form>
    </td>
</tr>
</table>
<div th:replace="~{fragments/admin-nav :: bootstrapJs}"></div>
</body>
</html>
