<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin - Events</title>
    <th:block th:replace="~{fragments/admin-nav :: adminAssets}"></th:block>
<link rel="stylesheet" href="/css/responsive.css"/>
    </head>
<body class="admin-body">

<div class="admin-shell">
    <aside th:replace="~{fragments/admin-nav :: adminSidebar('events')}"></aside>

    <div class="admin-main">
        <header th:replace="~{fragments/admin-nav :: adminTopbar('Events', 'Review, manage, or remove community events.')}"></header>

        <main class="admin-content">
            <div class="admin-page-header">
                <div class="admin-page-title">
                    <h2>Events</h2>
                    <p>Manage events created by meditation centres. Deleting an event also cancels any bookings against it.</p>
                </div>
                <a href="/admin/events/new" class="admin-btn success">
                    <i class="fa-solid fa-plus"></i>
                    Add Event
                </a>
            </div>

            <section class="admin-card">
                <div class="admin-card-header">
                    <h3>
                        <i class="fa-solid fa-calendar-days"></i>
                        Event Records
                    </h3>
                    <span class="admin-badge info" th:text="${#lists.size(events)} + ' events'">0 events</span>
                </div>

                <div class="admin-card-body">
                    <div class="admin-empty" th:if="${#lists.isEmpty(events)}">
                        <i class="fa-solid fa-calendar-xmark"></i>
                        <p>No events available.</p>
                    </div>

                    <div class="admin-table-wrap" th:unless="${#lists.isEmpty(events)}">
                        <table class="admin-table">
                            <thead>
                            <tr>
                                <th>ID</th>
                                <th>Title</th>
                                <th>Date</th>
                                <th>Venue</th>
                                <th>Center</th>
                                <th>Mode</th>
                                <th>Capacity</th>
                                <th>Bookings</th>
                                <th>Action</th>
                            </tr>
                            </thead>

                            <tbody>
                            <tr th:each="ev : ${events}">
                                <td th:text="${ev.id}">1</td>
                                <td><strong th:text="${ev.title}">Event title</strong></td>
                                <td th:text="${#temporals.format(ev.eventDate, 'dd MMM yyyy - HH:mm')}">Date</td>
                                <td th:text="${ev.venue ?: 'Not set'}">Venue</td>
                                <td th:text="${ev.meditationCenter != null ? ev.meditationCenter.name : '—'}">Center</td>
                                <td th:text="${ev.mode}">Physical</td>
                                <td th:text="${ev.capacity != null ? ev.capacity : 'Unlimited'}">Unlimited</td>
                                <td th:text="${bookingCounts[ev.id] ?: 0}">0</td>
<td>
                                    <div style="display:flex;gap:8px;flex-wrap:wrap;">
                                        <a class="admin-btn" th:href="@{'/admin/events/' + ${ev.id} + '/edit'}">
                                            <i class="fa-solid fa-pen"></i>
                                            Edit
                                        </a>
                                        <form method="post" th:action="@{'/admin/events/' + ${ev.id} + '/delete'}"
                                              onsubmit="return confirm('Delete this event? Any bookings against it will also be removed.');">
                                            <button type="submit" class="admin-btn danger">
                                                <i class="fa-solid fa-trash-can"></i>
                                                Delete
                                            </button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </section>
        </main>
    </div>
</div>

<div th:replace="~{fragments/admin-nav :: bootstrapJs}"></div>
</body>
</html>
