<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin - Add Event</title>
    <th:block th:replace="~{fragments/admin-nav :: adminAssets}"></th:block>
<link rel="stylesheet" href="/css/responsive.css"/>
    </head>
<body class="admin-body">

<div class="admin-shell">
    <aside th:replace="~{fragments/admin-nav :: adminSidebar('events')}"></aside>

    <div class="admin-main">
        <header th:replace="~{fragments/admin-nav :: adminTopbar('Add Event', 'Publish a new event on the live site.')}"></header>

        <main class="admin-content">
            <div class="admin-page-header">
                <div class="admin-page-title">
                    <h2>New Event</h2>
                    <p>Fill in the details below. The event will appear on the public events page as soon as it is created.</p>
                </div>
                <a href="/admin/events" class="admin-btn secondary">
                    <i class="fa-solid fa-arrow-left"></i>
                    Back to Events
                </a>
            </div>

            <section class="admin-card">
                <div class="admin-card-header">
                    <h3>
                        <i class="fa-solid fa-calendar-days"></i>
                        Event Details
                    </h3>
                </div>

                <div class="admin-card-body">
                    <form method="post" th:action="@{/admin/events/create}">
                        <div class="row g-3">
                            <div class="col-md-8">
                                <label class="form-label fw-bold">Event Title *</label>
                                <input type="text" name="title" class="admin-form-control" placeholder="e.g. Evening Metta Meditation" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label fw-bold">Centre *</label>
                                <select name="centerId" class="admin-form-control" required>
                                    <option value="" disabled selected>Select a centre</option>
                                    <option th:each="c : ${centers}" th:value="${c.id}" th:text="${c.name}">Centre</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Date &amp; Time *</label>
                                <input type="datetime-local" name="eventDate" class="admin-form-control" required>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label fw-bold">Mode</label>
                                <select name="mode" class="admin-form-control">
                                    <option th:each="m : ${modes}" th:value="${m.name()}" th:text="${m.name()}">PHYSICAL</option>
                                </select>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label fw-bold">Capacity</label>
                                <input type="number" name="capacity" class="admin-form-control" min="1"
                                       placeholder="Optional">
                            </div>
                            <div class="col-12">
                                <label class="form-label fw-bold">Venue</label>
                                <input type="text" name="venue" class="admin-form-control"
                                       placeholder="e.g. Main Meditation Hall / Online">
                            </div>
                            <div class="col-12">
                                <label class="form-label fw-bold">Description</label>
                                <textarea name="description" rows="4" class="admin-form-control"
                                          placeholder="Brief description of the event"></textarea>
                            </div>
                        </div>

                        <div class="d-flex gap-2 mt-4">
                            <button type="submit" class="admin-btn success">
                                <i class="fa-solid fa-check"></i>
                                Publish Event
                            </button>
                            <a href="/admin/events" class="admin-btn secondary">Cancel</a>
                        </div>
                    </form>
                </div>
            </section>
        </main>
    </div>
</div>

<div th:replace="~{fragments/admin-nav :: bootstrapJs}"></div>
</body>
</html>
