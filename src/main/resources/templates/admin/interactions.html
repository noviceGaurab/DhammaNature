<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin - Page Interactions</title>
    <th:block th:replace="~{fragments/admin-nav :: adminAssets}"></th:block>
</head>
<body class="admin-body">

<div class="admin-shell">
    <aside th:replace="~{fragments/admin-nav :: adminSidebar('interactions')}"></aside>

    <div class="admin-main">
        <header th:replace="~{fragments/admin-nav :: adminTopbar('Page Interactions', 'Track user activity and page interaction data.')}"></header>

        <main class="admin-content">
            <div class="admin-page-header">
                <div class="admin-page-title">
                    <h2>Page Interactions</h2>
                    <p>View page visits, section interactions, and content engagement records.</p>
                </div>
            </div>

            <section class="admin-card">
                <div class="admin-card-header">
                    <h3>
                        <i class="fa-solid fa-chart-line"></i>
                        Interaction Records
                    </h3>
                    <span class="admin-badge info" th:text="${#lists.size(interactionData)} + ' interactions'">0 interactions</span>
                </div>

                <div class="admin-card-body">
                    <div class="admin-empty" th:if="${#lists.isEmpty(interactionData)}">
                        <i class="fa-solid fa-chart-simple"></i>
                        <p>No interaction data available.</p>
                    </div>

                    <div class="admin-table-wrap" th:unless="${#lists.isEmpty(interactionData)}">
                        <table class="admin-table">
                            <thead>
                            <tr>
                                <th>ID</th>
                                <th>User ID</th>
                                <th>Page Name</th>
                                <th>Section</th>
                                <th>Content Interaction</th>
                                <th>Interaction Time</th>
                            </tr>
                            </thead>

                            <tbody>
                            <tr th:each="pi : ${interactionData}">
                                <td th:text="${pi.id}">1</td>
                                <td>
                                    <span class="admin-badge" th:text="${pi.user != null ? pi.user.id : 'Guest'}">Guest</span>
                                </td>
                                <td>
                                    <strong th:text="${pi.pageName}">Page</strong>
                                </td>
                                <td th:text="${pi.section}">Section</td>
                                <td th:text="${pi.contentInteraction}">Interaction</td>
                                <td th:text="${#temporals.format(pi.interactionTime, 'dd MMM yyyy HH:mm')}">01 Jan 2024 10:00</td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </section>
        </main>
    </div>
</div>

<div th:replace="~{fragments/admin-nav :: bootstrapJs}"></div>
</body>
</html>
