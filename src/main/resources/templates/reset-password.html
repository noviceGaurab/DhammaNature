<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Dhamma Nature</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="/css/login.css">
    <link rel="stylesheet" href="/css/carousel.css">
    <script defer src="/JS/carousel.js"></script>
</head>
<body class="auth-page">
    <div class="auth-wrap">
        <div class="auth-card">
            <aside class="auth-cover">
                <div class="dn-carousel dn-cover-carousel" data-autoplay="6000" data-mode="fade">
                    <div class="dn-track">
                        <div class="dn-slide active">
                            <img th:src="@{/site-assets/pexels-eky-rima-nurya-ganda-174710171-15147310/image(name='pexels-eky-rima-nurya-ganda-174710171-15147310')}" alt="Meditation" />
                        </div>
                        <div class="dn-slide">
                            <img th:src="@{/site-assets/pexels-cryschanxanhy-29547000/image(name='pexels-cryschanxanhy-29547000')}" alt="Temple Visit" />
                        </div>
                        <div class="dn-slide">
                            <img th:src="@{/site-assets/pexels-ron-lach-10461522/image(name='pexels-ron-lach-10461522')}" alt="Dhamma Talk" />
                        </div>
                    </div>
                </div>
                <div class="cover-quote">
                    <p>"Be kind whenever possible. It is always possible."</p>
                    <span>Start fresh</span>
                </div>
            </aside>
            <section class="auth-panel">
                <div class="auth-panel-decor"></div>
                <div class="auth-panel-inner">
                    <img class="auth-logo" th:src="@{/site-assets/logo/image(name='logo')}" alt="Dhamma Nature Logo" />
                    <h1 class="auth-title">Choose a new password</h1>
                    <p class="auth-subtitle">Pick something new and easy to remember.</p>

                    <p class="msg msg-error" th:if="${error}" th:text="${error}"></p>

                    <form class="auth-form" method="post" action="/reset-password">
                        <input type="hidden" name="token" th:value="${token}"/>
                        <div class="input-group">
                            <label for="password">New password</label>
                            <div class="input-wrapper">
                                <i class="fas fa-lock input-icon"></i>
                                <input type="password" id="password" name="password" placeholder="At least 8 characters" minlength="8" required autocomplete="new-password">
                                <button type="button" class="password-toggle" data-toggle-for="password" aria-label="Show password"><i class="fas fa-eye"></i></button>
                            </div>
                        </div>
                        <div class="input-group">
                            <label for="confirmPassword">Confirm new password</label>
                            <div class="input-wrapper">
                                <i class="fas fa-lock input-icon"></i>
                                <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Repeat your new password" required autocomplete="new-password">
                                <button type="button" class="password-toggle" data-toggle-for="confirmPassword" aria-label="Show password"><i class="fas fa-eye"></i></button>
                            </div>
                        </div>
                        <button type="submit" class="login-btn"><i class="fas fa-check"></i> Reset password</button>
                    </form>

                    <div class="auth-switch">
                        Changed your mind? <a href="/login"><i class="fas fa-sign-in-alt"></i> Back to login</a>
                    </div>
                </div>
                <a class="auth-visit" href="/"><i class="fas fa-arrow-right"></i> Visit Site</a>
            </section>
        </div>
    </div>
    <script>
        document.querySelectorAll('.password-toggle').forEach(function (btn) {
            btn.addEventListener('click', function () {
                var input = document.getElementById(btn.dataset.toggleFor);
                var show = input.type === 'password';
                input.type = show ? 'text' : 'password';
                btn.querySelector('i').className = show ? 'fas fa-eye-slash' : 'fas fa-eye';
            });
        });
    </script>
</body>
</html>
