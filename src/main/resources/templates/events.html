<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dhamma Nature - Events</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="/css/home_events.css">
    <style>
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 24px; padding: 60px 8%; }
        .card { border: 1px solid #eee; border-radius: 10px; padding: 20px; box-shadow: 0 4px 14px rgba(0,0,0,.06); }
        .badge { display:inline-block; padding: 2px 10px; border-radius: 12px; font-size: 12px; background:#eef; color:#233c9b; margin-bottom:8px;}
    </style>
</head>
<body>
<div th:replace="~{fragments/header :: siteHeader('UPCOMING EVENTS', 'FR-04: Event Management, validated by every organization interviewed')}"></div>
<main>
    <p style="padding: 30px 8% 0; color:#666;" th:if="${#lists.isEmpty(events)}">No upcoming events yet - check back soon.</p>
    <div class="grid">
        <div class="card" th:each="e : ${events}">
            <span class="badge" th:text="${e.mode}">MODE</span>
            <h3 th:text="${e.title}">Event title</h3>
            <p th:text="${#temporals.format(e.eventDate, 'dd MMM yyyy, HH:mm')}">Date</p>
            <p th:text="${e.venue}">Venue</p>
            <p><small th:text="${e.meditationCenter.name}">Center</small></p>
            <a th:href="@{'/events/' + ${e.id}}" class="btn btn-primary">View &amp; book</a>
        </div>
    </div>
</main>
<div th:replace="~{fragments/footer :: siteFooter}"></div>
</body>
</html>
