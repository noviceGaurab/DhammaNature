<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${center.name}">Center Profile</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="/css/home_events_descrpt.css">
    <style>
        .profile-wrap { max-width: 900px; margin: 0 auto; padding: 60px 20px; }
        .profile-header { display:flex; gap:16px; align-items:center; flex-wrap:wrap; }
        .socials a { margin-right: 10px; font-size: 20px; color:#233c9b; }
        .event-row { border-bottom: 1px solid #eee; padding: 14px 0; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;}
    </style>
</head>
<body>
<div th:replace="~{fragments/header :: siteHeader(null, null)}"></div>
<main class="profile-wrap">
    <div class="profile-header">
        <div>
            <h1 th:text="${center.name}">Center Name</h1>
            <p th:text="${center.location}">Location</p>
        </div>
    </div>
    <p th:text="${center.description}">Description of the meditation center - history, services, instructors...</p>
    <p><strong>Contact:</strong> <span th:text="${center.contactEmail}"></span> &middot; <span th:text="${center.contactNumber}"></span></p>
    <div class="socials">
        <a th:if="${center.website}" th:href="${center.website}" target="_blank"><i class="fas fa-globe"></i></a>
        <a th:if="${center.facebookUrl}" th:href="${center.facebookUrl}" target="_blank"><i class="fab fa-facebook"></i></a>
        <a th:if="${center.instagramUrl}" th:href="${center.instagramUrl}" target="_blank"><i class="fab fa-instagram"></i></a>
    </div>
    <p>
        <span th:if="${center.supportsOnlineSessions}" style="margin-right:14px;"><i class="fas fa-video"></i> Online sessions</span>
        <span th:if="${center.supportsPhysicalSessions}"><i class="fas fa-person-praying"></i> Physical sessions</span>
    </p>

    <h2>Upcoming events &amp; programs</h2>
    <p th:if="${#lists.isEmpty(events)}">No events published yet - check back soon.</p>
    <div class="event-row" th:each="e : ${events}">
        <div>
            <strong th:text="${e.title}">Event title</strong><br>
            <span th:text="${#temporals.format(e.eventDate, 'dd MMM yyyy, HH:mm')} + ' · ' + ${e.mode}"></span>
        </div>
        <a th:href="@{'/events/' + ${e.id}}" class="btn btn-outline-primary">View &amp; book</a>
    </div>
</main>
<div th:replace="~{fragments/footer :: siteFooter}"></div>
</body>
</html>
