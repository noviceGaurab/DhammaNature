<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dhamma Nature - Meditation Centers</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="/css/home_events.css">
    <style>
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 24px; padding: 60px 8%; }
        .card { border: 1px solid #eee; border-radius: 10px; overflow: hidden; box-shadow: 0 4px 14px rgba(0,0,0,.06); }
        .card img { width: 100%; height: 170px; object-fit: cover; }
        .card-body { padding: 16px; }
        .card-body h3 { margin: 0 0 6px; }
        .badge { display:inline-block; padding: 2px 10px; border-radius: 12px; font-size: 12px; background:#eef; color:#233c9b; margin-bottom:8px;}
        .search-bar { padding: 30px 8% 0; }
        .search-bar input { padding: 10px 14px; width: 100%; max-width: 420px; border: 1px solid #ccc; border-radius: 6px; }
    </style>
</head>
<body>
<div th:replace="~{fragments/header :: siteHeader('MEDITATION CENTER DIRECTORY', 'FR-03: browse organizations validated by the field study')}"></div>
<main>
    <div class="search-bar">
        <form method="get" action="/centers">
            <input type="text" name="q" placeholder="Search meditation centers..." th:value="${q}">
        </form>
    </div>
    <p style="padding: 10px 8% 0; color:#666;" th:if="${#lists.isEmpty(centers)}">No meditation centers published yet.</p>
    <div class="grid">
        <div class="card" th:each="c : ${centers}">
            <img th:if="${c.coverImageUrl}" th:src="@{'/assets/images/' + ${c.coverImageUrl}}" alt="cover"/>
            <img th:unless="${c.coverImageUrl}" src="/assets/images/pexels-tkirkgoz-15277853.jpg" alt="cover"/>
            <div class="card-body">
                <span class="badge" th:if="${c.supportsOnlineSessions and c.supportsPhysicalSessions}">Hybrid sessions</span>
                <span class="badge" th:if="${c.supportsOnlineSessions and !c.supportsPhysicalSessions}">Online only</span>
                <span class="badge" th:if="${!c.supportsOnlineSessions and c.supportsPhysicalSessions}">Physical only</span>
                <h3 th:text="${c.name}">Center name</h3>
                <p th:text="${c.location}">Location</p>
                <a th:href="@{'/centers/' + ${c.id}}" class="btn btn-primary">View profile</a>
            </div>
        </div>
    </div>
</main>
<div th:replace="~{fragments/footer :: siteFooter}"></div>
</body>
</html>
