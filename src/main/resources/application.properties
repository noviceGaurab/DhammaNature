spring.application.name=DhammaNature
server.port=3069

spring.profiles.active=local

# ===== TiDB (MySQL-wire compatible) Configuration =====
# Never commit real credentials. Set these as environment variables
# (IntelliJ: Run/Debug Configurations -> Environment Variables) or in a
# local .env / application-local.properties that is git-ignored.
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://46dueJSRsux6ZJr.root:nFmv60ttPtP0hiOk@gateway01.ap-southeast-1.prod.aws.tidbcloud.com:4000/test
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}

spring.datasource.hikari.connection-timeout=10000

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

# ===== Application base URL (used for links in emails) =====
app.base-url=${BASE_URL:http://localhost:3069}
# Site alert email (defaults to the mailbox configured in spring.mail.username)
app.notify-email=${NOTIFY_EMAIL:}

# ===== Mail (booking confirmations, reward + donation receipts) =====
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ===== Uploaded gallery / product images =====
app.upload.dir=${UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ===== Seed / demo data =====
app.seed-demo-data=${SEED_DEMO_DATA:true}

# ===== Admin bootstrap (first run only, if no admin user exists) =====
app.admin.email=${ADMIN_EMAIL:admin@dhammanature.org}
app.admin.password=${ADMIN_PASSWORD:ChangeMe123!}

spring.thymeleaf.cache=false

# ===== Session management =====
# Sessions expire after 20 minutes of inactivity (server side). The JSESSIONID
# cookie is a browser-session cookie (max-age=-1) so it is dropped when the
# browser is closed - a closed tab / restarted app can never reopen a stale
# logged-in admin panel.
server.servlet.session.timeout=20m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.max-age=-1
server.servlet.session.cookie.secure=false
