spring.application.name=DhammaNature
server.port=${PORT:3069}

# ===== TiDB (MySQL-wire compatible) Configuration =====
# No credentials are stored here. The JDBC URL intentionally contains no
# username/password. Set DB_USERNAME and DB_PASSWORD as environment variables
# on the deployment platform. For local development they come from the
# git-ignored application-local.properties (active only when the "local"
# profile is enabled, e.g. in your IDE run configuration).
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://gateway01.ap-southeast-1.prod.aws.tidbcloud.com:4000/test
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}

spring.datasource.hikari.connection-timeout=30000

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

# ===== Application base URL (used for links in emails) =====
app.base-url=${BASE_URL:http://localhost:3069}
# Site alert email (defaults to the mailbox configured in spring.mail.username)
app.notify-email=${NOTIFY_EMAIL:}

# ===== Mail (booking confirmations, reward + donation receipts) =====
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ===== Uploaded images (stored as DB BLOBs; only multipart limits remain) =====
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ===== Seed / demo data =====
app.seed-demo-data=${SEED_DEMO_DATA:true}

# ===== Admin bootstrap (first run only, if no admin user exists) =====
app.admin.email=${ADMIN_EMAIL:admin@dhammanature.org}
app.admin.password=${ADMIN_PASSWORD:ChangeMe123!}

spring.thymeleaf.cache=false

# ===== Session management =====
# Sessions expire after 20 minutes of inactivity (server side). The JSESSIONID
# cookie is a browser-session cookie (max-age=-1) so it is dropped when the
# browser is closed - a closed tab / restarted app can never reopen a stale
# logged-in admin panel.
server.servlet.session.timeout=20m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.max-age=-1
server.servlet.session.cookie.secure=false
